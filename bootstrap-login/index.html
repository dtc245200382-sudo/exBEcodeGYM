<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f5f5f5;
        }

        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: 0 auto;
        }

        .form-signin .checkbox {
            font-weight: 400;
        }

        .form-signin .form-control {
            position: relative;
            box-sizing: border-box;
            height: auto;
            padding: 10px;
            font-size: 16px;
        }

        .form-signin .form-control:focus {
            z-index: 2;
        }

        .form-signin input[type="email"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
    </style>
</head>
<body class="text-center">
    <main class="form-signin">
        <form id="login-form">
            <img class="mb-4" src="https://getbootstrap.com/docs/5.0/assets/brand/bootstrap-logo.svg"
                 alt="Bootstrap" width="72" height="72">
            <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

            <label class="visually-hidden" for="inputEmail">Email address</label>
            <input type="email" id="inputEmail" class="form-control"
                   placeholder="Email address" autocomplete="username" required autofocus>

            <label class="visually-hidden" for="inputPassword">Password</label>
            <input type="password" id="inputPassword" class="form-control"
                   placeholder="Password" autocomplete="current-password" required>

            <div class="checkbox mb-3">
                <label for="remember-me">
                    <input type="checkbox" id="remember-me" value="remember-me"> Remember me
                </label>
            </div>

            <button class="btn btn-lg btn-primary w-100" type="submit">Sign in</button>
            <p id="form-message" class="small text-muted mt-3" role="status" hidden></p>
            <p class="mt-5 mb-3 text-muted">&copy; 2017–2018</p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <script>
        // Bài thực hành giao diện: không gửi hoặc lưu email/mật khẩu.
        document.getElementById('login-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const message = document.getElementById('form-message');
            message.textContent = 'Demo form only. No sign-in has been performed.';
            message.hidden = false;
        });
    </script>
</body>
</html>
